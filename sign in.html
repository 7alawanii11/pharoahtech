<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join us</title>
    <link rel="stylesheet" href="style(sign in).css" />
  </head>
  <body class="signin">
    <h1>Join Us</h1>

    <p class="one">Enter your full name:</p>
    <input type="text" placeholder="full name" class="fullname" />

    <section>
      <p class="zero">Select your gender:</p>
      <input type="radio" name="gendre" id="male" />
      <label for="male" class="male">male</label>

      <input type="radio" name="gendre" id="female" />
      <label for="female" class="female">female</label>

      <input type="radio" name="gendre" id="prefer_not_to_answer" /><label
        for="prefer_not_to_answer"
        class="prefer"
        >prefer not to answer</label
      >
    </section>

    <p class="two">Enter your username:</p>
    <input type="text" placeholder="username" class="username" />

    <p class="three">Enter your email:</p>
    <input type="email" placeholder="email" class="email" />

    <p class="four">Enter your password:</p>
    <input type="password" placeholder="password" class="password" />

    <p class="five">Enter your phone number:</p>
    <input
      type="tel"
      placeholder="phone number"
      class="number"
      maxlength="11"
      minlength="11"
    />

    <br />
